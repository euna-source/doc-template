[project]
name = "doc-template"
version = "0.2.0"
description = "옵시디언 Markdown을 기획·리서치 문서 HTML로 렌더하는 템플릿 엔진과 MCP 서버"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["markdown-it-py>=3", "mdit-py-plugins>=0.4", "pyyaml>=6", "beautifulsoup4>=4.12", "mcp>=1.2"]

[project.scripts]
doc-template = "doc_template.cli:main"
doc-template-mcp = "doc_template.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_template"]
