<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="@THEME_COLOR_L">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="@DESC">
<meta name="generator" content="doc-template · @THEME_NAME">
<meta property="og:title" content="@TITLE">
<meta property="og:description" content="@DESC">
@CANONICAL
<title>@TITLE</title>
<script>try{var t=localStorage.getItem('doc-tpl-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700;800&display=swap">
<style>
/*@CSS*/
</style>
</head>
<body class="@BODYCLASS">
<a class="skip" href="#doc">본문으로 건너뛰기</a>
<header class="bar">
  <div class="bar-inner">
    <p class="bar-title"><span class="bar-kind">@KIND</span><span class="sep" aria-hidden="true">·</span><b>@SHORT</b></p>
    <div class="bar-actions">
      <button class="tool" id="mark-btn" type="button" aria-pressed="true" aria-label="강조 표시"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h7"/><path d="m14.5 4.5 5 5L11 18H6v-5z"/></svg><span class="label">강조</span></button>
      <button class="tool" id="theme-btn" type="button" aria-label="다크 모드로 보기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z"/></svg><span class="label">다크</span></button>
      <button class="tool" id="copy-btn" type="button" aria-label="이 문서 링크 복사"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1"/><path d="M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"/></svg><span class="label">링크</span></button>
      <button class="tool" id="share-btn" type="button" aria-label="공유하기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg><span class="label">공유</span></button>
      <button class="tool" id="print-btn" type="button" aria-label="인쇄하거나 PDF로 저장"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 9V3h10v6"/><rect x="3" y="9" width="18" height="8" rx="1.5"/><path d="M7 14h10v7H7z"/></svg><span class="label">인쇄</span></button>
    </div>
  </div>
  <div class="progress" aria-hidden="true"><span id="progress"></span></div>
</header>
<div class="page">
  <header class="cover">
    <div class="issue"><strong>@ISSUE_L</strong><span>@ISSUE_R</span></div>
    <div class="cover-main">
      <p class="kind">@EYEBROW</p>
      <h1>@H1</h1>
      <p class="deck">@DECK</p>
    </div>
    <dl class="meta">@META</dl>
    @OBI
  </header>
  @BAND
  <div class="layout">
    <nav class="toc" aria-label="목차"><p class="toc-title">목차</p><ol>@TOC</ol></nav>
    <main class="doc" id="doc">
      <details class="toc-mobile"><summary>목차 · @NSEC개 절</summary><ol>@TOC</ol></details>
      @MAIN
    </main>
  </div>
  <footer class="foot"><span>@FOOT</span></footer>
</div>
@DRAWERS
<button class="to-top" id="to-top" type="button" aria-label="맨 위로"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5"/><path d="m6 11 6-6 6 6"/></svg></button>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
/*@JS*/
</script>
</body>
</html>
